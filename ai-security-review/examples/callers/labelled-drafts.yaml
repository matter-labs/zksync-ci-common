name: AI Security Review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions: {}

concurrency:
  group: ai-security-review-caller-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ai-security-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-security-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-security-review') &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: matter-labs/zksync-ci-common/.github/workflows/ai-security-review.yaml@ENGINE_COMMIT_SHA
    with:
      maximum_batches: 24

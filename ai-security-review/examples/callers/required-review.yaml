name: AI Security Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ai-security-review-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ai-security-review:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: matter-labs/zksync-ci-common/.github/workflows/ai-security-review.yaml@ENGINE_COMMIT_SHA
    with:
      maximum_batches: 24
      fail_on_findings: true

  required-review:
    name: AI security review required
    needs: [ai-security-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful security review
        shell: bash
        env:
          REVIEW_RESULT: ${{ needs.ai-security-review.result }}
        run: |
          if [[ "$REVIEW_RESULT" != "success" ]]; then
            echo "::error::AI security review must complete successfully before merging (result: ${REVIEW_RESULT})."
            exit 1
          fi

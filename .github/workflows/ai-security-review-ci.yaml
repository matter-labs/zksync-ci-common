name: AI Security Review CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-security-review-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: AI review engine checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pinned lockfile parsers without lifecycle scripts
        working-directory: ai-security-review
        run: npm ci --prefix . --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Audit engine dependencies
        run: npm audit --audit-level moderate --prefix ai-security-review

      - name: Check scripts
        run: |
          for script in ai-security-review/scripts/*.mjs; do
            node --check "$script"
          done

      - name: Check JSON files
        run: |
          find ai-security-review -type d -name node_modules -prune -o -name '*.json' -print0 |
            xargs -0 -n1 node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))'

      - name: Check formatting
        run: >-
          npx --yes prettier@3.6.2 --config ai-security-review/.prettierrc.json --check
          ai-security-review .github/workflows/ai-security-review*.yaml .github/dependabot.yml

      - name: Set up the pinned action's Bun runtime for launcher regression tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Run unit tests
        env:
          BUN_EXECUTABLE: bun
        run: node --test ai-security-review/test/*.test.mjs

      - name: Smoke test pinned Claude CLI
        run: node ai-security-review/scripts/smoke-test-claude-cli.mjs

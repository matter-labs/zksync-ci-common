name: Check topup-balances

# Type-checks and unit-tests the balance top-up job (.github/scripts/topup-balances).

on:
  pull_request:
    paths:
      - '.github/scripts/topup-balances/**'
      - '.github/workflows/check-topup-balances.yaml'
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts/topup-balances
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/scripts/topup-balances/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
